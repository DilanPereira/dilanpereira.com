# =============================================================================
#  nginx.conf do contentor "portfolio"
# =============================================================================
#  No servidor este ficheiro está em /mnt/ssd/apps/portfolio/nginx.conf e é
#  montado dentro do contentor como /etc/nginx/conf.d/default.conf.
#  Depois de o alterar:   docker restart portfolio
#
#  O que faz, em resumo:
#    - Ficheiros que existem na pasta html/ (css, js, imagens, robots.txt,
#      contacto.php) são servidos diretamente.
#    - Tudo o resto (/, /pt/, /project/..., /sitemap.xml, endereços antigos
#      como /projeto.php) é entregue ao router.php, que decide o que mostrar.
#    - CSS, JS e fontes ficam em cache no browser 1 ano, imagens 7 dias
#      (o PHP acrescenta "?v=..." ao CSS/JS, por isso uma alteração é sempre vista).
#    - Texto (HTML, CSS, JS, SVG...) é comprimido com gzip.
# =============================================================================

server {
    # Porta dentro do contentor (o Nginx Proxy Manager encaminha para aqui)
    listen 80;
    server_name localhost;

    # Pasta pública do site (dentro do contentor). A pasta assets_priv fica ao lado,
    # fora daqui, por isso nunca é acessível pelo browser.
    root /var/www/html;
    index router.php;

    # Não mostrar a versão do nginx nas páginas de erro nem no cabeçalho "Server"
    server_tokens off;

    # Tamanho máximo de um pedido. O formulário de contacto tem no máximo ~6 KB;
    # 64 KB chega e sobra, e corta logo pedidos enormes enviados por bots.
    client_max_body_size 64k;

    # Compressão: o HTML/CSS/JS chega ao browser ~70% mais pequeno.
    # (imagens PNG/JPG e fontes woff2 já vêm comprimidas, não vale a pena)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/xml
               image/svg+xml text/plain text/xml image/x-icon;

    # Nunca servir ficheiros escondidos (.git, .env, .htaccess...), mesmo que
    # algum vá parar à pasta pública por engano.
    # Fica em primeiro lugar porque o nginx usa a primeira regra "~" que corresponder.
    location ~ /\. {
        return 404;
    }

    # Ficheiros estáticos (css, js, fontes, imagens).
    # "^~" faz com que esta regra ganhe às regras "~" abaixo: nada dentro de
    # /assets/ é alguma vez executado como PHP.
    location ^~ /assets/ {
        # Ficheiro inexistente -> 404 simples (não passa pelo router)
        try_files $uri =404;

        # Imagens: cache de 7 dias (604800 s). Não têm "?v=", por isso uma imagem
        # substituída com o mesmo nome demora no máximo uma semana a atualizar.
        add_header Cache-Control "public, max-age=604800";
        # (um add_header aqui substitui os de fora, por isso repete-se o nosniff)
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;   # não encher o log com pedidos de imagens/CSS

        # CSS, JS e fontes: cache de 1 ano (31536000 s). "immutable" diz ao browser
        # que nem precisa de perguntar se mudou: o PHP acrescenta "?v=<data>" ao
        # CSS/JS, por isso quando o ficheiro muda o endereço também muda.
        location ~* \.(css|js|woff2)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }
    }

    # Ficheiros da raiz que mudam raramente (robots.txt, favicon...): cache de 1 dia
    location ~* ^/[^/]+\.(txt|ico|png|svg|webmanifest)$ {
        try_files $uri /router.php$is_args$args;
        expires 1d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Pedidos normais:
    #   $uri               -> se o ficheiro pedido existe, serve-o
    #   /router.php?...    -> se não existe (ex.: /pt/projeto/portfolio), passa ao router,
    #                         mantendo os parâmetros (?x=1) com $is_args$args
    location / {
        try_files $uri /router.php$is_args$args;
    }

    # Pedidos a ficheiros .php:
    location ~ \.php$ {
        # Se o .php existe (router.php, contacto.php), executa-o.
        # Se não existe (ex.: o antigo /projeto.php?id=1), passa ao router,
        # que o redireciona para o endereço novo.
        try_files $uri /router.php$is_args$args;

        # Envia o pedido ao PHP (php-fpm) que corre dentro do mesmo contentor.
        # Os cabeçalhos de segurança das páginas (CSP, etc.) são enviados pelo
        # PHP, no config.php.
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_index router.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Não deixar o PHP anunciar a versão (reforço do header_remove do config.php)
        fastcgi_hide_header X-Powered-By;
    }
}
